name: "Build Test Lint"
run-name: Build Test Lint of ${{ github.ref_name }} by @${{ github.actor }}

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      debug_enabled:
        type: boolean
        description: 'Run the build with tmate debugging enabled (https://github.com/marketplace/actions/debugging-with-tmate)'
      debug_step:
        required: false
        description: "Pause the build job to debug using tmate (lint/test are only debuggable when those workflows are run directly via workflow_dispatch)"
        type: choice
        default: ""
        options:
          - ""
          - build
          - test
          - lint

jobs:
  build:
    permissions: write-all
    uses: notch8/actions/.github/workflows/build.yaml@v1.0.10
    secrets: inherit
    with:
      components: '["web","worker","solr","nginx"]'
      docker_target_prefix: hyku-

  nginx-config-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate nginx server block syntax
        run: |
          mkdir -p /tmp/bitnami-conf/server_blocks/common /tmp/bitnami-conf/server_blocks/ldap /tmp/bitnami-logs
          chmod 777 /tmp/bitnami-logs
          sed 's/{{ .Values.global.hyraxHostName }}/127.0.0.1/' ops/nginx/server-block.conf > /tmp/bitnami-conf/server_blocks/common/server-block.conf
          printf 'include  "/opt/bitnami/nginx/conf/server_blocks/ldap/*.conf";\ninclude  "/opt/bitnami/nginx/conf/server_blocks/common/*.conf";\n' > /tmp/bitnami-conf/server_blocks/server-blocks-paths.conf
          cp -r ops/nginx/conf.d /tmp/bitnami-conf/conf.d
          cp -r ops/nginx/bots.d /tmp/bitnami-conf/bots.d
          docker run --rm \
            -v ./ops/nginx/nginx.conf:/etc/nginx/nginx.conf:ro \
            -v /tmp/bitnami-conf:/opt/bitnami/nginx/conf:ro \
            -v /tmp/bitnami-logs:/opt/bitnami/nginx/logs \
            nginxinc/nginx-unprivileged:1.29-alpine \
            nginx -t

  lint:
    needs: build
    uses: notch8/actions/.github/workflows/lint.yaml@v1.0.10
    secrets: inherit
    with:
      rubocop_cmd: "bundle exec rubocop --parallel --format progress --require rubocop/formatter/junit_formatter --format RuboCop::Formatter::JUnitFormatter --out rubocop.xml"

  test:
    needs: build
    uses: notch8/actions/.github/workflows/test.yaml@v1.0.10
    secrets: inherit
    with:
      confdir: "/app/samvera/hyrax-webapp/solr/conf"
      rspec_cmd: "gem install semaphore_test_boosters && bundle && rspec_booster --job $CI_NODE_INDEX/$CI_NODE_TOTAL"

  reports:
    if: always()
    needs: [test, lint]
    uses: notch8/actions/.github/workflows/report.yaml@v1.0.10
