upstream rails_app {
  server {{ .Values.global.hyraxHostName }};
}

map $status $loggable {
    ~^444  0;
    default 1;
}

# Lets ActionCable's websocket handshake upgrade instead of falling through to a plain HTTP request Rails 404s.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

log_format loki 'host=$host ip=$http_x_forwarded_for remote_user=$remote_user [$time_local] '
                  'request="$request" status=$status bytes=$body_bytes_sent '
                  'referer="$http_referer" agent="$http_user_agent" request_time=$request_time upstream_response_time=$upstream_response_time upstream_response_length=$upstream_response_length';

error_log  /opt/bitnami/nginx/logs/error.log warn;

# Cloudflare ips see for refresh
# https://support.cloudflare.com/hc/en-us/articles/200170786-Restoring-original-visitor-IPs-logging-visitor-IP-addresses
# update list https://www.cloudflare.com/ips/
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

real_ip_header X-Forwarded-For;
real_ip_recursive on;
server {
    listen 8080;
    server_name _;
    root /app/samvera/hyrax-webapp/public;
    index index.html;

    client_body_in_file_only clean;
    client_body_buffer_size 32K;
    client_max_body_size 0;
    access_log /opt/bitnami/nginx/logs/access.log loki if=$loggable;
    sendfile on;
    send_timeout 300s;

    location ~ (\.php|\.aspx|\.asp) {
    	return 404;
    }

    # deny requests for files that should never be accessed
    location ~ /\. {
      deny all;
    }

    location ~* ^.+\.(rb|log)$ {
      deny all;
    }

    location ~ ^/(assets|packs|fonts|images|javascripts|stylesheets|swfs|system|uv|clover-iiif|branding)/ {
      try_files $uri @rails;

      gzip_static on; # to serve pre-gzipped version

      expires max;
      add_header Cache-Control public;

      # Strip these so browsers don't send conditional-GET requests despite the Expires header.
      add_header Last-Modified "";
      add_header ETag "";
      break;
    }

    # Long proxy timeout for large uploads/downloads/bulk import-export; everything else keeps @rails' short default.
    location ~ ^/(uploads|downloads|importers|exporters|single_use_link)(/|$) {
      proxy_set_header  X-Real-IP  $remote_addr;
      proxy_set_header  X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Host $http_host;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_redirect off;
      proxy_connect_timeout 3600s;
      proxy_send_timeout 3600s;
      proxy_read_timeout 3600s;
      proxy_pass http://rails_app;
    }

    # send non-static file requests to the app server
    location / {
      try_files $uri @rails;
    }

    location @rails {
      proxy_set_header  X-Real-IP  $remote_addr;
      proxy_set_header  X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Host $http_host;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_redirect off;
      proxy_pass http://rails_app;
    }
}
